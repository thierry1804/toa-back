framework:
    workflows:
        permit_workflow:
            type: 'state_machine'
            audit_trail:
                enabled: true
            marking_store:
                type: 'method'
                property: 'state'
            supports:
                - App\Domain\Permit\Entity\Permit
            initial_marking: draft
            places:
                - draft
                - submitted
                - awaiting_chef
                - awaiting_hse
                - validated
                - in_progress
                - closed
                - rejected
                - expired
            transitions:
                submit:
                    from: draft
                    to: submitted
                forward_to_chef:
                    from: submitted
                    to: awaiting_chef
                approve_by_chef:
                    from: awaiting_chef
                    to: awaiting_hse
                approve_by_hse:
                    from: awaiting_hse
                    to: validated
                start_work:
                    from: validated
                    to: in_progress
                close:
                    from: in_progress
                    to: closed
                reject:
                    from:
                        - submitted
                        - awaiting_chef
                        - awaiting_hse
                    to: rejected
                expire:
                    from:
                        - validated
                        - in_progress
                    to: expired
