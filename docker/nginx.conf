# ACME HTTP-01 challenge + HTTPS redirect for the public domain
server {
    listen 80;
    server_name haythi.net www.haythi.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Plain HTTP access via IP / localhost (kept for local/dev use, e.g. :8080)
server {
    listen 80 default_server;
    server_name localhost;
    root /var/www/toa-api/public;

    # App-level upload limit is 10M (see DocumentUploadProcessor etc.); keep
    # this above that plus multipart/JSON overhead so nginx never rejects a
    # legitimate request before it reaches Symfony (which is the only layer
    # that adds CORS headers).
    client_max_body_size 20M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/project_error.log;
    access_log /var/log/nginx/project_access.log;
}

# HTTPS access via the public domain
server {
    listen 443 ssl;
    server_name haythi.net www.haythi.net;
    root /var/www/toa-api/public;

    ssl_certificate /etc/letsencrypt/live/haythi.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haythi.net/privkey.pem;

    client_max_body_size 20M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/project_error_ssl.log;
    access_log /var/log/nginx/project_access_ssl.log;
}
