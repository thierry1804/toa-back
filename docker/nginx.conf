server {
    listen 80;
    server_name localhost;
    root /var/www/toa-api/public;

    # App-level upload limit is 10M (see DocumentUploadProcessor etc.); keep
    # this above that plus multipart/JSON overhead so nginx never rejects a
    # legitimate request before it reaches Symfony (which is the only layer
    # that adds CORS headers).
    client_max_body_size 20M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/project_error.log;
    access_log /var/log/nginx/project_access.log;
}
